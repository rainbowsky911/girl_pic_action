name: backup-d1 (D1数据库备份到R2)

# 每6小时备份一次, 覆盖R2单个最新文件: backup/girlpic_d1/girlpic_d1_latest.sql
# D1 export ~8MB/10s, 频繁备份+覆盖最新, 不堆积历史文件
# 恢复方法: npx wrangler d1 execute zdw --file=girlpic_d1_latest.sql --remote

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  push:
    paths: ['.github/workflows/backup-d1.yml']
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: load-secrets
        run: echo '${{ secrets.SECRETS_JSON }}' | jq -r 'to_entries[] | "\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV

      - name: export-d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export zdw --remote --output="girlpic_d1_latest.sql"
          ls -lh girlpic_d1_latest.sql

      - name: upload-to-r2 (overwrite latest)
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ env.R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ env.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp girlpic_d1_latest.sql "s3://${R2_BUCKET}/backup/girlpic_d1/girlpic_d1_latest.sql" --endpoint-url "${R2_ENDPOINT}"
          echo "uploaded (overwrite): s3://${R2_BUCKET}/backup/girlpic_d1/girlpic_d1_latest.sql"

      - name: cleanup-old-dated-files
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ env.R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ env.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "backup/girlpic_d1/" \
            --endpoint-url "${R2_ENDPOINT}" --query 'Contents[].Key' --output text | tr '\t' '\n' | while read key; do
            [ -z "$key" ] && continue
            if [ "$key" != "backup/girlpic_d1/girlpic_d1_latest.sql" ]; then
              aws s3 rm "s3://${R2_BUCKET}/${key}" --endpoint-url "${R2_ENDPOINT}"
              echo "removed old: $key"
            fi
          done
