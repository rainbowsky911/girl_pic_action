name: check-images (安全检查)

on:
  schedule:
    - cron: '0 9 * * *'
  push:
    paths: ['.github/workflows/check-images.yml', 'scripts/tasks/']
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'batch size (default 300)'
        required: false
        default: '300'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: 'pip' }
      - name: install-deps
        run: pip install httpx
      - name: load-secrets
        run: echo '${{ secrets.SECRETS_JSON }}' | jq -r 'to_entries[] | "\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV
      - name: run-check-images
        run: python scripts/tasks/check_images_onetime.py ${{ github.event.inputs.batch_size || '300' }}
