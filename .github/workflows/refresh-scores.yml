name: refresh-scores (首页排序)

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  push:
    paths: ['.github/workflows/refresh-scores.yml', 'worker/sql/refresh_scores.sql']
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: load-secrets
        run: echo '${{ secrets.SECRETS_JSON }}' | jq -r 'to_entries[] | "\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV
      - name: run-refresh-scores
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
        working-directory: worker
        run: npx wrangler d1 execute zdw --file=sql/refresh_scores.sql --remote
