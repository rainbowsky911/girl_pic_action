name: sync-images-test (图片同步测试)

# 测试用: 新表 girls_pic_test (结构与 girls_pic 一致), 不影响旧 sync-images 任务
# 与旧任务错开 30 分钟避免并发

on:
  schedule:
    - cron: '30 8 * * *'
  push:
    paths: ['.github/workflows/sync-images-test.yml', 'worker/sql/sync_images_test.sql']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: load-secrets
        run: echo '${{ secrets.SECRETS_JSON }}' | jq -r 'to_entries[] | "\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV
      - name: run-sync-images-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
        working-directory: worker
        run: npx wrangler d1 execute zdw --file=sql/sync_images_test.sql --remote
