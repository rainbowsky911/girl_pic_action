name: crawler (爬虫)

# 爬虫: 每12小时执行一次
# 用 playwright 爬取图片, 上传 R2, 写入 D1
# 公开仓库不限 Actions 时长

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    paths: ['.github/workflows/crawler.yml', 'scripts/tasks/crawler_onetime.py', 'scripts/tasks/d1_client.py']
  workflow_dispatch:
    inputs:
      pages:
        description: '爬取页数 (默认20)'
        required: false
        default: '20'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: 'pip' }

      - name: install-deps
        run: |
          pip install playwright boto3 aiohttp httpx
          python -m playwright install chromium --with-deps

      - name: load-secrets
        run: echo '${{ secrets.SECRETS_JSON }}' | jq -r 'to_entries[] | "\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV

      - name: run-crawler
        run: python scripts/tasks/crawler_onetime.py ${{ github.event.inputs.pages || '20' }}
